# ATAK Systems - server config
# Edited by the server operator. Changes require server restart.
# Lines starting with # are ignored. Format: key=value, no spaces around =.

# --- Markers -----------------------------------------------------------
# Max markers a single player can own at once. Oldest rolls over.
markers.per_player_limit=20

# Global cap across the whole session (bounds JIP payload).
markers.total_limit=500

# Max length of a user-entered marker label. Clamped server-side.
markers.label_max_length=64

# If true, markers survive a session save/load cycle.
# Ship default is false (wipe on mission end); persistence lands in a later update.
markers.persist_across_mission=false

# --- Device ------------------------------------------------------------
# Master toggle: if false, the device battery never drains regardless of use.
device.battery_drain_enabled=true

# Minutes of continuous use to drain from 100% to 0%. Ignored if drain off.
device.battery_minutes_full_to_empty=120

# If false, device ignores antenna signal entirely (always full bars).
device.signal_gating_enabled=true

# --- Logging -----------------------------------------------------------
# 0=silent, 1=warnings, 2=verbose
log.verbosity=1
